<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Hand-off">
  <defs>
    <style>
      .title { font: 700 20px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .h { font: 700 15px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .t { font: 400 13px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .w { font: 700 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .step { fill: #eef2ff; stroke: #c7d2fe; }
      .p { fill: #2563eb; }
      .m { fill: #d97706; }
      .mbad { fill: #9ca3af; }
      .g { fill: #0d9488; }
    </style>
    <marker id="n" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="460" rx="16" fill="#fafafa"/>
  <text x="36" y="40" class="title">Hand-off：M 阻塞时，P 立刻换人继续跑</text>
  <rect x="36" y="70" width="260" height="200" rx="12" class="step"/>
  <text x="166" y="100" text-anchor="middle" class="h">1. 正常执行</text>
  <rect x="80" y="125" width="50" height="28" rx="6" class="p"/><text x="105" y="144" text-anchor="middle" class="w">P</text>
  <rect x="145" y="125" width="50" height="28" rx="6" class="m"/><text x="170" y="144" text-anchor="middle" class="w">M1</text>
  <rect x="210" y="125" width="50" height="28" rx="6" class="g"/><text x="235" y="144" text-anchor="middle" class="w">G</text>
  <text x="166" y="190" text-anchor="middle" class="t">M1 绑着 P 跑 G</text>
  <text x="166" y="220" text-anchor="middle" class="t">本地队列还有任务</text>
  <path d="M310 170 H350" stroke="#4b5563" stroke-width="2.2" fill="none" marker-end="url(#n)"/>
  <rect x="360" y="70" width="260" height="200" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="490" y="100" text-anchor="middle" class="h">2. G 把 M1 卡住</text>
  <rect x="405" y="125" width="50" height="28" rx="6" class="p"/><text x="430" y="144" text-anchor="middle" class="w">P</text>
  <rect x="470" y="125" width="70" height="28" rx="6" class="mbad"/><text x="505" y="144" text-anchor="middle" class="w">M1阻塞</text>
  <text x="490" y="190" text-anchor="middle" class="t">系统调用等阻塞发生</text>
  <text x="490" y="220" text-anchor="middle" class="t" fill="#b91c1c">若死抱 P，工位就浪费</text>
  <path d="M634 170 H674" stroke="#4b5563" stroke-width="2.2" fill="none" marker-end="url(#n)"/>
  <rect x="684" y="70" width="190" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="779" y="100" text-anchor="middle" class="h">3. 交接</text>
  <text x="779" y="145" text-anchor="middle" class="t">M1 与 P 解绑</text>
  <text x="779" y="175" text-anchor="middle" class="t">P 找空闲 M</text>
  <text x="779" y="205" text-anchor="middle" class="t">没有就新建 M2</text>
  <text x="779" y="240" text-anchor="middle" class="t" fill="#047857">P 继续干活</text>
  <rect x="120" y="300" width="660" height="120" rx="12" fill="#fff" stroke="#d1d5db"/>
  <text x="450" y="335" text-anchor="middle" class="h">交接后的状态</text>
  <rect x="220" y="355" width="50" height="28" rx="6" class="mbad"/><text x="245" y="374" text-anchor="middle" class="w">M1</text>
  <text x="310" y="374" class="t">仍阻塞着（等系统调用返回）</text>
  <rect x="520" y="355" width="50" height="28" rx="6" class="p"/><text x="545" y="374" text-anchor="middle" class="w">P</text>
  <text x="580" y="360" class="t">+</text>
  <rect x="600" y="355" width="50" height="28" rx="6" class="m"/><text x="625" y="374" text-anchor="middle" class="w">M2</text>
  <text x="665" y="374" class="t">继续跑剩余 G</text>
</svg>
